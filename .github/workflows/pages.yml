# Publicação automática: todo push na branch padrão vai ao ar sozinho.
# Entregar é publicar, não commitar — não existe passo manual de deploy.
#
# As mesmas conferências do PR rodam aqui de novo, ANTES de publicar:
# publicar arquivo quebrado é publicar com sucesso, e o job ficaria verde
# do mesmo jeito com a tela em branco no ar.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar as dependências
        run: npm ci

      - name: Bateria da lógica
        run: npm test

      - name: Build
        run: npm run build

      - name: Conferência de fumaça do que vai ao ar
        run: npm run fumaca

      # `enablement: true` pede para o próprio workflow criar o site do
      # Pages, para o ajuste não depender de alguém lembrar de marcar uma
      # caixa no painel (regra 13b). ⚠ Medido em 03/09/2026, na primeira
      # execução deste repositório: NÃO basta. O token do Actions responde
      # `Resource not accessible by integration` ao criar o site, e o job
      # fica vermelho — que é o certo, porque ele não publicou nada.
      #
      # Ou seja: ligar o Pages a primeira vez continua sendo um passo de
      # pessoa, uma vez só, em Settings → Pages → Source: GitHub Actions.
      # A linha fica porque, com o site já ligado, ela não atrapalha, e
      # porque é ela que documenta a tentativa que foi medida.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: publicacao
        uses: actions/deploy-pages@v4

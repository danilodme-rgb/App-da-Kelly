<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Gatinho da Kelly">
  <title>Gatinho da Kelly</title>
  <!-- Ícone mascarável: o desenho fica dentro do círculo seguro (80% do
       lado), porque o Android recorta as bordas em formatos variados. -->
